services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dept_rag
      POSTGRES_PASSWORD: dept_rag
      POSTGRES_DB: dept_rag
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dept_rag"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
